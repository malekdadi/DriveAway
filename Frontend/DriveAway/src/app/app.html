<header class="site-header" (keydown.escape)="menuOpen && closeMenu(menuButton)">
  <a class="skip-link" href="#main">Aller au contenu</a>
  <div class="shell header-inner">
    <a class="brand" routerLink="/" (click)="menuOpen = false" aria-label="DriveAway, accueil"><img src="media/driveaway.png" alt="DriveAway"></a>
    <button #menuButton class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="navigation">
      <span class="icon" aria-hidden="true">{{ menuOpen ? 'close' : 'menu' }}</span> Menu
    </button>
    <nav id="navigation" class="module-nav" [class.open]="menuOpen" aria-label="Services DriveAway">
      @for (service of services; track service.path) {
        <a class="module-link" [routerLink]="['/', service.path]" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="menuOpen = false">
          <span class="nav-icon icon" aria-hidden="true">{{ service.icon }}</span>
          <span class="nav-label">{{ service.title }}</span>
        </a>
      }
    </nav>
    <div class="theme-switch" role="group" aria-label="Apparence du site">
      <button type="button" (click)="setTheme(false)" [attr.aria-pressed]="!nightMode" aria-label="Mode jour" title="Mode jour">
        <span class="icon" aria-hidden="true">light_mode</span>
      </button>
      <button type="button" (click)="setTheme(true)" [attr.aria-pressed]="nightMode" aria-label="Mode nuit" title="Mode nuit">
        <span class="icon" aria-hidden="true">dark_mode</span>
      </button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1"><router-outlet /></main>
<footer>
  <div class="shell footer-inner">
    <div class="footer-brand">
      <a class="brand" routerLink="/" aria-label="DriveAway, accueil"><img src="media/driveaway.png" alt="DriveAway"></a>
      <span>Location de voitures en Tunisie</span>
    </div>
    <nav class="footer-links" aria-label="Navigation de pied de page">
      <a routerLink="/vehicules">Notre flotte</a>
      <a routerLink="/agences">Nos agences</a>
      <a routerLink="/reservations">Préparer ma location <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</footer>
