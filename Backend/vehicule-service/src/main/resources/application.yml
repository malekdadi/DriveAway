server:
  port: 8087

spring:
  application:
    name: vehicule-service

  # --- H2 Database Configuration ---
  datasource:
    url: jdbc:h2:mem:vehiculedb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

# --- Eureka Registration ---
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: false          # Set to true when Eureka server is running
  instance:
    prefer-ip-address: true

# --- Swagger ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
