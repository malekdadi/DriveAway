<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <h2 class="mb-4"><i class="bi bi-speedometer2"></i> Dashboard</h2>

    <!-- Alert messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Stat cards -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Total Véhicules</div>
                        <div class="fs-3 fw-bold" th:text="${totalVehicules}">0</div>
                    </div>
                    <i class="bi bi-car-front stat-icon text-primary"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Disponibles</div>
                        <div class="fs-3 fw-bold text-success" th:text="${disponibles}">0</div>
                    </div>
                    <i class="bi bi-check-circle stat-icon text-success"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Loués</div>
                        <div class="fs-3 fw-bold text-primary" th:text="${loues}">0</div>
                    </div>
                    <i class="bi bi-key stat-icon text-primary"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Catégories</div>
                        <div class="fs-3 fw-bold text-info" th:text="${totalCategories}">0</div>
                    </div>
                    <i class="bi bi-tags stat-icon text-info"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent vehicles table -->
    <div class="card stat-card">
        <div class="card-body">
            <h5 class="card-title mb-3">Derniers véhicules</h5>
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Immatriculation</th>
                    <th>Marque</th>
                    <th>Modèle</th>
                    <th>Catégorie</th>
                    <th>Statut</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${recentVehicules}">
                    <td th:text="${v.idVehicule()}"></td>
                    <td>
                        <img th:if="${!v.images().isEmpty()}" th:src="${v.images().get(0)}" alt="car"
                             style="width:45px; height:35px; object-fit:cover; border-radius:4px;">
                        <i th:if="${v.images().isEmpty()}" class="bi bi-car-front text-muted"></i>
                    </td>
                    <td><code th:text="${v.immatriculation()}"></code></td>
                    <td th:text="${v.marque()}"></td>
                    <td th:text="${v.modele()}"></td>
                    <td th:text="${v.categorie()?.nom()}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${v.statut() == 'DISPONIBLE'} ? 'badge-disponible' :
                              (${v.statut() == 'LOUE'} ? 'badge-loue' :
                              (${v.statut() == 'EN_MAINTENANCE'} ? 'badge-maintenance' : 'badge-hors-service'))"
                              th:text="${v.statut()}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
