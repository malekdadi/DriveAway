<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <h2 class="mb-4" style="font-weight:700;"><i class="bi bi-speedometer2" style="color:var(--accent);"></i> Dashboard</h2>

    <!-- Alert messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Stat cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-label">Total Véhicules</div>
                        <div class="stat-value" th:text="${totalVehicules}">0</div>
                    </div>
                    <i class="bi bi-car-front stat-icon" style="color:var(--accent);"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-label">Disponibles</div>
                        <div class="stat-value" style="color:var(--success);" th:text="${disponibles}">0</div>
                    </div>
                    <i class="bi bi-check-circle stat-icon" style="color:var(--success);"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-label">Loués</div>
                        <div class="stat-value" style="color:var(--info);" th:text="${loues}">0</div>
                    </div>
                    <i class="bi bi-key stat-icon" style="color:var(--info);"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-label">Catégories</div>
                        <div class="stat-value" style="color:var(--warning);" th:text="${totalCategories}">0</div>
                    </div>
                    <i class="bi bi-tags stat-icon" style="color:var(--warning);"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent vehicles -->
    <div class="stat-card">
        <div class="p-3">
            <h5 style="font-weight:700; margin-bottom:16px;"><i class="bi bi-clock-history me-2" style="color:var(--accent);"></i>Derniers véhicules</h5>
            <table class="dark-table">
                <thead>
                <tr>
                    <th>Image</th>
                    <th>Immatriculation</th>
                    <th>Marque / Modèle</th>
                    <th>Catégorie</th>
                    <th>Km</th>
                    <th>Statut</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${recentVehicules}">
                    <td>
                        <img th:if="${!v.images().isEmpty()}" th:src="${v.images().get(0)}" alt="car"
                             style="width:48px; height:36px; object-fit:cover; border-radius:6px; border:1px solid var(--border-color);">
                        <div th:if="${v.images().isEmpty()}" style="width:48px; height:36px; background:var(--bg-input); border-radius:6px; display:flex; align-items:center; justify-content:center;">
                            <i class="bi bi-car-front" style="color:var(--text-muted);"></i>
                        </div>
                    </td>
                    <td><code style="color:var(--accent); background:var(--accent-soft); padding:3px 8px; border-radius:4px;" th:text="${v.immatriculation()}"></code></td>
                    <td><span th:text="${v.marque() + ' ' + v.modele()}"></span></td>
                    <td><span style="color:var(--text-secondary);" th:text="${v.categorie()?.nom()}"></span></td>
                    <td><span style="color:var(--text-secondary);" th:text="${v.kilometrage() + ' km'}"></span></td>
                    <td>
                        <span class="badge"
                              th:classappend="${v.statut() == 'DISPONIBLE'} ? 'badge-disponible' :
                              (${v.statut() == 'LOUE'} ? 'badge-loue' :
                              (${v.statut() == 'EN_MAINTENANCE'} ? 'badge-maintenance' : 'badge-hors-service'))"
                              th:text="${v.statut()}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
