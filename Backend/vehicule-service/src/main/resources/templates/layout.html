<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'DriveAway Backoffice'">DriveAway Backoffice</title>
    <!-- Modern Typography: Plus Jakarta Sans + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0d14;
            --bg-secondary: #101522;
            --bg-card: rgba(19, 24, 38, 0.75);
            --bg-card-hover: rgba(28, 35, 54, 0.9);
            --bg-input: #151a2a;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(99, 102, 241, 0.35);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --accent-soft: rgba(99, 102, 241, 0.12);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.25);
            --danger: #f43f5e;
            --warning: #f59e0b;
            --info: #0ea5e9;
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            background-image: radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                              radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5, h6, .brand { font-family: 'Plus Jakarta Sans', sans-serif; }
        a { color: var(--accent); text-decoration: none; transition: all 0.2s var(--ease-spring); }
        a:hover { color: #818cf8; }

        /* Sidebar Glassmorphic */
        .sidebar {
            background: rgba(16, 21, 34, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            min-height: 100vh;
            border-right: 1px solid var(--border-color);
            position: fixed;
            width: 250px;
            z-index: 100;
        }
        .sidebar .brand {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            padding: 24px 22px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .brand-badge {
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 9999px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--border-highlight);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sidebar nav { padding: 16px 12px; }
        .sidebar-section-title {
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            padding: 10px 12px 6px;
        }
        .sidebar nav a {
            color: var(--text-secondary);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 3px 0;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s var(--ease-spring);
        }
        .sidebar nav a i { font-size: 1.1rem; transition: transform 0.2s; }
        .sidebar nav a:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(3px);
        }
        .sidebar nav a:hover i { transform: scale(1.1); color: var(--accent); }
        .sidebar nav a.active {
            color: #fff;
            background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 100%);
            font-weight: 600;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .sidebar nav a.active i { color: #fff; }
        .sidebar nav .divider { border-top: 1px solid var(--border-color); margin: 12px 6px; }

        /* Main Content Header & Container */
        .main-content {
            margin-left: 250px;
            padding: 32px 40px;
            min-height: 100vh;
        }
        .top-status-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 20px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
        }
        .system-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Modern Glass Cards */
        .dark-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            transition: all 0.3s var(--ease-spring);
            overflow: hidden;
        }
        .dark-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-highlight);
            transform: translateY(-4px);
            box-shadow: 0 16px 36px -10px rgba(0,0,0,0.5), 0 0 24px -6px var(--accent-glow);
        }
        .dark-card .card-body { padding: 22px; }

        /* Stat Cards */
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            transition: all 0.25s var(--ease-spring);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0.8;
        }
        .stat-card:hover {
            border-color: var(--border-highlight);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.4);
        }
        .stat-card .stat-value {
            font-size: 2.1rem;
            font-weight: 800;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .stat-card .stat-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .stat-icon {
            font-size: 2.2rem;
            opacity: 0.75;
            transition: transform 0.3s var(--ease-spring);
        }
        .stat-card:hover .stat-icon { transform: scale(1.15) rotate(5deg); }

        /* Modern Status Badges with Glowing Dots */
        .badge {
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }
        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .badge-disponible { background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-disponible .badge-dot { background: #10b981; box-shadow: 0 0 6px #10b981; }
        .badge-loue { background: rgba(14, 165, 233, 0.12); color: #0ea5e9; border: 1px solid rgba(14, 165, 233, 0.3); }
        .badge-loue .badge-dot { background: #0ea5e9; box-shadow: 0 0 6px #0ea5e9; }
        .badge-maintenance { background: rgba(245, 158, 11, 0.12); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-maintenance .badge-dot { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
        .badge-hors-service { background: rgba(244, 63, 94, 0.12); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
        .badge-hors-service .badge-dot { background: #f43f5e; box-shadow: 0 0 6px #f43f5e; }

        /* Form Controls */
        .form-control, .form-select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.9rem;
            transition: all 0.2s var(--ease-spring);
        }
        .form-control:focus, .form-select:focus {
            background: #192033;
            color: var(--text-primary);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            transform: scale(1.005);
        }
        .form-control::placeholder { color: var(--text-muted); }
        .form-label {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .form-text { color: var(--text-muted); font-size: 0.8rem; }
        .form-check-input {
            background-color: var(--bg-input);
            border-color: var(--border-color);
            cursor: pointer;
        }
        .form-check-input:checked {
            background-color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* Buttons with tactile feedback */
        .btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.2s var(--ease-spring);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 9px 22px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #7174f8 0%, #4338ca 100%);
            box-shadow: 0 6px 20px var(--accent-glow);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .btn-outline-primary {
            color: var(--accent);
            border: 1px solid var(--border-highlight);
            background: var(--accent-soft);
        }
        .btn-outline-primary:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .btn-outline-danger {
            color: var(--danger);
            border: 1px solid rgba(244, 63, 94, 0.3);
            background: rgba(244, 63, 94, 0.08);
        }
        .btn-outline-danger:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3);
        }
        .btn-ghost {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 10px;
            border-radius: 8px;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        /* Modern Alerts */
        .alert {
            border-radius: 12px;
            border: 1px solid transparent;
            padding: 14px 18px;
            backdrop-filter: blur(8px);
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.3);
            color: #34d399;
        }
        .alert-danger {
            background: rgba(244, 63, 94, 0.12);
            border-color: rgba(244, 63, 94, 0.3);
            color: #fb7185;
        }

        /* Pagination */
        .pagination .page-link {
            background: var(--bg-card);
            border-color: var(--border-color);
            color: var(--text-secondary);
            border-radius: 10px;
            margin: 0 3px;
            font-weight: 600;
            padding: 8px 14px;
            transition: all 0.2s var(--ease-spring);
        }
        .pagination .page-link:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--border-highlight);
        }
        .pagination .page-item.active .page-link {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* Search Box */
        .search-box { position: relative; }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .search-box input { padding-left: 42px; }
        .search-box input:focus + i { color: var(--accent); }

        /* Vehicle Image with Zoom on Hover */
        .vehicle-img-wrap {
            position: relative;
            height: 190px;
            overflow: hidden;
            border-radius: 15px 15px 0 0;
            background: #0f1422;
        }
        .vehicle-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s var(--ease-spring);
        }
        .dark-card:hover .vehicle-img {
            transform: scale(1.05);
        }
        .vehicle-img-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #151a2a 0%, #1a2238 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vehicle-img-placeholder i { font-size: 3.2rem; color: var(--text-muted); opacity: 0.5; }

        /* Category Thumb */
        .cat-img {
            width: 58px;
            height: 58px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        /* Modern Tables */
        .dark-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .dark-table th {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
        }
        .dark-table td {
            color: var(--text-primary);
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            transition: background 0.15s;
        }
        .dark-table tr:hover td { background: rgba(255, 255, 255, 0.03); }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 26px;
        }
        .section-header h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Micro Smooth Animation */
        .fade-item { animation: smoothFadeIn 0.35s var(--ease-spring); }
        @keyframes smoothFadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }
    </style>
</head>
<body>
<!-- Glassmorphic Sidebar -->
<aside class="sidebar">
    <div class="brand">
        <i class="bi bi-car-front-fill" style="color:var(--accent); font-size:1.4rem;"></i>
        <span>DriveAway</span>
        <span class="brand-badge ms-auto">v1.0</span>
    </div>
    <nav>
        <div class="sidebar-section-title">Navigation Principale</div>
        <a th:href="@{/backoffice}" th:classappend="${activePage == 'dashboard'} ? 'active'">
            <i class="bi bi-grid-1x2"></i> Tableau de bord
        </a>
        <a th:href="@{/backoffice/categories}" th:classappend="${activePage == 'categories'} ? 'active'">
            <i class="bi bi-tags"></i> Catégories
        </a>
        <a th:href="@{/backoffice/vehicules}" th:classappend="${activePage == 'vehicules'} ? 'active'">
            <i class="bi bi-car-front"></i> Véhicules
        </a>

        <div class="divider"></div>
        <div class="sidebar-section-title">Outils Développeur</div>
        <a th:href="@{/swagger-ui.html}" target="_blank">
            <i class="bi bi-file-earmark-code"></i> API Swagger UI
        </a>
        <a th:href="@{/h2-console}" target="_blank">
            <i class="bi bi-database"></i> Console H2
        </a>
        <a th:href="@{/actuator/health}" target="_blank">
            <i class="bi bi-heart-pulse"></i> Actuator Santé
        </a>
    </nav>
</aside>

<!-- Main content area -->
<main class="main-content">
    <!-- Top Modern Status Bar -->
    <div class="top-status-bar">
        <div class="system-pill">
            <span class="pulse-dot"></span>
            <span>Système Connecté &bull; <strong>vehicule-service</strong> (:8087)</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="badge" style="background:var(--accent-soft); color:var(--accent); border:1px solid var(--border-highlight);">
                <i class="bi bi-shield-check"></i> Gateway Port 8080 Prêt
            </span>
        </div>
    </div>

    <!-- Active Template Injection -->
    <div th:replace="~{${contentTemplate} :: content}">Content goes here</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
