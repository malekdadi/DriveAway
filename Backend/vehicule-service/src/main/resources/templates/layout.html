<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'DriveAway Backoffice'">DriveAway Backoffice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { background: #1e293b; min-height: 100vh; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px 20px; display: block; border-radius: 8px; margin: 4px 10px; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: #334155; }
        .sidebar .brand { color: #fff; font-size: 1.4rem; font-weight: bold; padding: 20px; border-bottom: 1px solid #334155; margin-bottom: 10px; }
        .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card .card-body { padding: 20px; }
        .stat-icon { font-size: 2rem; opacity: 0.7; }
        .table th { background: #f8fafc; font-weight: 600; }
        .badge-disponible { background: #22c55e; }
        .badge-loue { background: #3b82f6; }
        .badge-maintenance { background: #f59e0b; }
        .badge-hors-service { background: #ef4444; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="brand"><i class="bi bi-car-front-fill"></i> DriveAway</div>
            <nav>
                <a th:href="@{/backoffice}" th:classappend="${activePage == 'dashboard'} ? 'active'">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a th:href="@{/backoffice/categories}" th:classappend="${activePage == 'categories'} ? 'active'">
                    <i class="bi bi-tags"></i> Catégories
                </a>
                <a th:href="@{/backoffice/vehicules}" th:classappend="${activePage == 'vehicules'} ? 'active'">
                    <i class="bi bi-car-front"></i> Véhicules
                </a>
                <a th:href="@{/swagger-ui.html}" target="_blank">
                    <i class="bi bi-filetype-json"></i> API Swagger
                </a>
                <a th:href="@{/h2-console}" target="_blank">
                    <i class="bi bi-database"></i> H2 Console
                </a>
            </nav>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-4">
            <div th:replace="~{${contentTemplate} :: content}">Content goes here</div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
