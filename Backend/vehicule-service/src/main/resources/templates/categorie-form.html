<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="section-header">
        <h2>
            <i class="bi bi-tags"></i>
            <span th:text="${categorie.idCategorie != null} ? 'Modifier la catégorie' : 'Nouvelle catégorie'"></span>
        </h2>
        <a th:href="@{/backoffice/categories}" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-1"></i> Retour
        </a>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="stat-card">
                <div class="p-4">
                    <form th:action="@{/backoffice/categories/save}" method="post" th:object="${categorie}"
                          id="catForm" novalidate onsubmit="return validateCatForm()">
                        <input type="hidden" th:field="*{idCategorie}">

                        <div class="mb-4">
                            <label class="form-label">Nom *</label>
                            <input type="text" class="form-control" th:field="*{nom}" id="catNom"
                                   maxlength="100" placeholder="Ex: SUV, Berline, Citadine...">
                            <div class="invalid-feedback" id="catNomError">Le nom est obligatoire</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" th:field="*{description}" id="catDesc" rows="3" maxlength="500"
                                      placeholder="Description de la catégorie..."></textarea>
                            <div class="d-flex justify-content-between mt-1">
                                <div class="invalid-feedback" id="catDescError"></div>
                                <small class="form-text" id="catDescCount">0/500</small>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-control" th:field="*{imageUrl}" id="catImageUrl"
                                   maxlength="500" placeholder="https://example.com/image.jpg"
                                   oninput="previewCatImage()">
                            <div class="invalid-feedback" id="catImageUrlError">URL invalide</div>
                            <div class="form-text">Lien vers une image représentant cette catégorie</div>
                            <!-- Preview -->
                            <div id="catImagePreview" class="mt-3" style="display:none;">
                                <img id="catPreviewImg" alt="Preview"
                                     style="max-height:140px; border-radius:10px; border:2px solid var(--border-color);">
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{statut}" id="statutSwitch">
                                <label class="form-check-label" for="statutSwitch">Catégorie active</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i> Enregistrer
                            </button>
                            <a th:href="@{/backoffice/categories}" class="btn btn-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Side help -->
        <div class="col-md-4">
            <div class="stat-card">
                <div class="p-4">
                    <h6 style="font-weight:700; color:var(--accent); margin-bottom:12px;">
                        <i class="bi bi-info-circle me-1"></i> Guide
                    </h6>
                    <ul style="color:var(--text-secondary); font-size:0.85rem; padding-left:18px; line-height:2;">
                        <li><strong>Nom</strong> — unique, 2 à 100 caractères</li>
                        <li><strong>Description</strong> — optionnelle, max 500 car.</li>
                        <li><strong>Image</strong> — URL directe vers une image</li>
                        <li><strong>Statut</strong> — inactive = non visible côté client</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Character count
        const descField = document.getElementById('catDesc');
        const descCount = document.getElementById('catDescCount');
        function updateDescCount() {
            descCount.textContent = descField.value.length + '/500';
        }
        descField.addEventListener('input', updateDescCount);
        updateDescCount();

        // Image preview
        function previewCatImage() {
            const url = document.getElementById('catImageUrl').value.trim();
            const preview = document.getElementById('catImagePreview');
            const img = document.getElementById('catPreviewImg');
            if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
                img.src = url;
                preview.style.display = '';
                img.onerror = () => { preview.style.display = 'none'; };
            } else {
                preview.style.display = 'none';
            }
        }
        // Init preview on load
        previewCatImage();

        // Validation
        function validateCatForm() {
            let valid = true;
            const nom = document.getElementById('catNom');
            const imageUrl = document.getElementById('catImageUrl');

            // Reset
            nom.classList.remove('is-invalid');
            imageUrl.classList.remove('is-invalid');

            // Nom: required, min 2 chars
            if (!nom.value.trim() || nom.value.trim().length < 2) {
                nom.classList.add('is-invalid');
                document.getElementById('catNomError').textContent =
                    !nom.value.trim() ? 'Le nom est obligatoire' : 'Le nom doit contenir au moins 2 caractères';
                valid = false;
            }

            // Image URL: if filled, must be a valid URL
            if (imageUrl.value.trim() && !imageUrl.value.trim().match(/^https?:\/\/.+/)) {
                imageUrl.classList.add('is-invalid');
                valid = false;
            }

            return valid;
        }

        // Live validation on input
        document.getElementById('catNom').addEventListener('input', function() {
            this.classList.remove('is-invalid');
        });
        document.getElementById('catImageUrl').addEventListener('input', function() {
            this.classList.remove('is-invalid');
        });
    </script>
</div>
</body>
</html>
