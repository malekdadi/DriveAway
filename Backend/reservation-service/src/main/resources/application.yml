server:
  port: 8081

spring:
  application:
    name: reservation-service
  datasource:
    url: jdbc:mysql://localhost:3307/reservation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ""          # <- votre mot de passe MySQL
  jpa:
    hibernate:
      ddl-auto: update    # crée/met à jour les tables reservation et contrat
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# --- Connexion Dynamique à Eureka ---
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

# --- Actuator & Métadonnées Eureka ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: reservation-service
    version: 1.0.0
    description: Microservice DriveAway
    developer: Nouha Bel Hadj Maouia