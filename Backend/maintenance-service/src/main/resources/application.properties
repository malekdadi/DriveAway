spring.application.name=maintenance-service
server.port=8086

# Base H2
spring.datasource.url=jdbc:h2:mem:maintenancedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Configuration Client Eureka ---
eureka.client.service-url.defaultZone=http://100.78.116.80:8762/eureka/
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true

# --- Configuration Instance Eureka (Tailscale) ---
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=100.103.248.32
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.ip-address}:${server.port}

# --- Configuration Actuator & Observabilité ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.health.rabbit.enabled=false

# --- Métadonnées Dashboard Eureka ---
info.app.name=maintenance-service
info.app.version=1.0.0
info.app.description=Microservice DriveAway - Maintenance & Entretiens
info.app.developer=Farah
