spring.application.name=utilisateur-service

server.port=8081

spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Connexion Eureka central Achref
eureka.client.service-url.defaultZone=http://100.78.116.80:8761/eureka/
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=100.105.212.117
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.ip-address}:${server.port}