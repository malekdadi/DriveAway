spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/driveaway}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
server.error.include-message=always
driveaway.mail.from=${MAIL_FROM:${SMTP_USER:}}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
driveaway.konnect.base=${KONNECT_API_URL:https://api.sandbox.konnect.network/api/v2}
driveaway.konnect.key=${KONNECT_API_KEY:}
driveaway.konnect.wallet=${KONNECT_WALLET_ID:}
driveaway.konnect.webhook=${KONNECT_WEBHOOK_URL:}

spring.sql.init.mode=always
