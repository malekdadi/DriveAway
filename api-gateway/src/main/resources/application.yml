server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: paiement-service
              uri: lb://paiement-service
              predicates:
                - Path=/api/factures/**,/api/paiements/**,/api/cautions/**,/api/konnect/webhook,/api/vehicules,/test-facturation.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka/}
    register-with-eureka: false
    fetch-registry: true
